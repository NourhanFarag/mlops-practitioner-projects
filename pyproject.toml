[project]
name = "prodml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn==1.7.2",
    "pandas",
    "pyarrow",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "numpy",
    "skl2onnx",
    "onnxruntime",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "httpx",
    "pre-commit",
]

[project.scripts]
prodml-train = "prodml.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.black]
target-version = ["py310"]
[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/prodml --cov-fail-under=70"
